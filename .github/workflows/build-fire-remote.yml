name: Build Soft4All Fire Remote APK

on:
  push:
    paths:
      - 'fire-remote/**'
      - '.github/workflows/build-fire-remote.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: fire-remote
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp fire-remote/app/build/outputs/apk/debug/app-debug.apk Soft4AllFireRemote.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Soft4AllFireRemote-APK
          path: Soft4AllFireRemote.apk
          if-no-files-found: error
