plugins {
    id 'com.android.application'
}

android {
    namespace 'com.soft4all.fireremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soft4all.fireremote'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '6.0'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
